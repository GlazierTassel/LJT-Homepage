name: Build Test (temporary)

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify output
        run: |
          set -e
          test -f _site/index.html && echo "PASS: index.html built"
          test -f _site/publications/index.html && echo "PASS: publications index built"
          test -f _site/cv/index.html && echo "PASS: cv page built"
          grep -q "SynLogic" _site/index.html && echo "PASS: SynLogic listed on home"
          grep -q "Zhiyuan Honor Scholarship" _site/index.html && echo "PASS: award listed on home"
          grep -q "jliugi@connect.ust.hk" _site/index.html && echo "PASS: email listed on home"
          grep -q "Vicent0205" _site/index.html && echo "PASS: GitHub link on home"
          ls _site/publication/
          ls _site/publications/
